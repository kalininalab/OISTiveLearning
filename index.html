<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DNA Birthday Problem Explorer</title>
  <!-- Tailwind CSS for clean, responsive minimalist styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter & JetBrains Mono fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <main class="w-full max-w-5xl mx-auto px-3 py-4 sm:px-5 sm:py-5">
    <!-- Compact Header -->
    <header class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <div class="flex items-center gap-2.5">
        <div class="flex items-center gap-1" aria-label="4-letter alphabet A C G T">
          <span class="inline-flex items-center justify-center w-5 h-5 rounded text-[11px] font-mono font-bold bg-emerald-100 text-emerald-800">A</span>
          <span class="inline-flex items-center justify-center w-5 h-5 rounded text-[11px] font-mono font-bold bg-blue-100 text-blue-800">C</span>
          <span class="inline-flex items-center justify-center w-5 h-5 rounded text-[11px] font-mono font-bold bg-amber-100 text-amber-800">G</span>
          <span class="inline-flex items-center justify-center w-5 h-5 rounded text-[11px] font-mono font-bold bg-rose-100 text-rose-800">T</span>
        </div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900">
          Birthday Problem Explorer
        </h1>
      </div>
      <p class="text-xs text-slate-500">
        Freeze 1 parameter &middot; adjust either of the other 2 (<span class="font-mono">D = 4<sup>K</sup></span>)
      </p>
    </header>

    <!-- EXACTLY THREE Parameter Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-3.5" aria-label="Birthday Problem Parameters">

      <!-- =================================================================
           CARD 1: Number of Sequences (N)
           ================================================================= -->
      <article id="cardN" class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col gap-3 transition-all duration-150">
        <div class="flex items-center justify-between gap-2">
          <label for="inputN" class="text-sm font-semibold text-slate-800 leading-tight">
            Number of Sequences (N)
          </label>
          <label for="freezeN" class="freeze-pill inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-slate-200 bg-slate-100 text-slate-600 text-xs font-semibold cursor-pointer select-none transition-colors hover:bg-slate-200 shrink-0">
            <input type="checkbox" id="freezeN" data-param="N" class="w-3.5 h-3.5 rounded accent-blue-600 cursor-pointer" />
            <span class="freeze-label">Freeze</span>
          </label>
        </div>

        <div class="relative">
          <input
            type="text"
            id="inputN"
            inputmode="decimal"
            aria-label="Number of Sequences (N)"
            class="w-full font-mono text-lg font-bold tabular-nums bg-slate-100 text-slate-900 border border-transparent rounded-lg px-3 py-1.5 outline-none transition focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 disabled:bg-white/70 disabled:text-blue-900 disabled:border-blue-200 disabled:cursor-not-allowed"
          />
        </div>

        <div class="flex flex-col gap-1">
          <input
            type="range"
            id="sliderN"
            min="0.30103"
            max="9"
            step="0.001"
            aria-label="Log scale slider for Number of Sequences N"
            class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer accent-indigo-600 disabled:accent-blue-600 disabled:opacity-60 disabled:cursor-not-allowed"
          />
          <div class="flex justify-between font-mono text-[10px] text-slate-400 px-0.5">
            <span>2</span>
            <span>10<sup>2</sup></span>
            <span>10<sup>4</sup></span>
            <span>10<sup>6</sup></span>
            <span>10<sup>9</sup></span>
          </div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1.5 border-t border-slate-100 min-h-[22px]">
          <span>Log scale (<span class="font-mono">2–10<sup>9</sup></span>)</span>
          <span id="badgeN" class="hidden px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 font-semibold text-[10px]"></span>
        </div>
      </article>

      <!-- =================================================================
           CARD 2: Sequence Length (K) — Frozen by default
           ================================================================= -->
      <article id="cardK" class="bg-blue-50/70 border border-blue-400 rounded-xl p-4 shadow-sm ring-2 ring-blue-100 flex flex-col gap-3 transition-all duration-150">
        <div class="flex items-center justify-between gap-2">
          <label for="inputK" class="text-sm font-semibold text-slate-800 leading-tight">
            Sequence Length (K)
          </label>
          <label for="freezeK" class="freeze-pill inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-blue-600 bg-blue-600 text-white text-xs font-semibold cursor-pointer select-none transition-colors shrink-0">
            <input type="checkbox" id="freezeK" data-param="K" checked class="w-3.5 h-3.5 rounded accent-blue-800 cursor-pointer" />
            <span class="freeze-label">Frozen</span>
          </label>
        </div>

        <div class="relative flex items-center">
          <input
            type="text"
            id="inputK"
            inputmode="decimal"
            disabled
            aria-label="Sequence Length (K)"
            class="w-full font-mono text-lg font-bold tabular-nums bg-slate-100 text-slate-900 border border-transparent rounded-lg pl-3 pr-10 py-1.5 outline-none transition focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 disabled:bg-white/70 disabled:text-blue-900 disabled:border-blue-200 disabled:cursor-not-allowed"
          />
          <span class="absolute right-3 font-mono text-xs font-semibold text-slate-400 pointer-events-none">bp</span>
        </div>

        <div class="flex flex-col gap-1">
          <input
            type="range"
            id="sliderK"
            min="1"
            max="30"
            step="0.1"
            disabled
            aria-label="Linear slider for Sequence Length K"
            class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer accent-indigo-600 disabled:accent-blue-600 disabled:opacity-60 disabled:cursor-not-allowed"
          />
          <div class="flex justify-between font-mono text-[10px] text-slate-400 px-0.5">
            <span>1</span>
            <span>10</span>
            <span>20</span>
            <span>30</span>
          </div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1.5 border-t border-blue-200/60 min-h-[22px]">
          <span>Space: <span id="metaSpace" class="font-mono font-semibold text-slate-700">1,048,576</span></span>
          <span id="badgeK" class="hidden px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 font-semibold text-[10px]"></span>
        </div>
      </article>

      <!-- =================================================================
           CARD 3: Collision Probability (P) — Single card, single slider
           ================================================================= -->
      <article id="cardP" class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col gap-3 transition-all duration-150">
        <div class="flex items-center justify-between gap-1.5 flex-wrap">
          <label for="inputP" class="text-sm font-semibold text-slate-800 leading-tight">
            Collision Probability (P)
          </label>
          <div class="flex items-center gap-1.5 shrink-0">
            <!-- Linear / Log scale toggle pill for THIS single slider -->
            <div class="inline-flex bg-slate-100 border border-slate-200 rounded-full p-0.5" role="group" aria-label="Probability slider scale">
              <button type="button" id="btnPLinear" class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-white text-indigo-600 shadow-sm transition">
                Linear
              </button>
              <button type="button" id="btnPLog" class="px-2 py-0.5 rounded-full text-[11px] font-semibold text-slate-500 hover:text-slate-700 transition">
                Log
              </button>
            </div>
            <label for="freezeP" class="freeze-pill inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-slate-200 bg-slate-100 text-slate-600 text-xs font-semibold cursor-pointer select-none transition-colors hover:bg-slate-200">
              <input type="checkbox" id="freezeP" data-param="P" class="w-3.5 h-3.5 rounded accent-blue-600 cursor-pointer" />
              <span class="freeze-label">Freeze</span>
            </label>
          </div>
        </div>

        <div class="relative flex items-center">
          <input
            type="text"
            id="inputP"
            inputmode="decimal"
            aria-label="Collision Probability percentage P"
            class="w-full font-mono text-lg font-bold tabular-nums bg-slate-100 text-slate-900 border border-transparent rounded-lg pl-3 pr-8 py-1.5 outline-none transition focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 disabled:bg-white/70 disabled:text-blue-900 disabled:border-blue-200 disabled:cursor-not-allowed"
          />
          <span class="absolute right-3 font-mono text-sm font-semibold text-slate-400 pointer-events-none">%</span>
        </div>

        <div class="flex flex-col gap-1">
          <input
            type="range"
            id="sliderP"
            min="0"
            max="100"
            step="0.01"
            aria-label="Slider for Collision Probability P"
            class="w-full h-2 bg-slate-200 rounded-lg cursor-pointer accent-indigo-600 disabled:accent-blue-600 disabled:opacity-60 disabled:cursor-not-allowed"
          />
          <div id="ticksP" class="flex justify-between font-mono text-[10px] text-slate-400 px-0.5">
            <span>0%</span>
            <span>25%</span>
            <span>50%</span>
            <span>75%</span>
            <span>100%</span>
          </div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1.5 border-t border-slate-100 min-h-[22px]">
          <span>Exact P: <span id="metaExactP" class="font-mono font-semibold text-slate-700">0.5000</span></span>
          <span id="badgeP" class="hidden px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 font-semibold text-[10px]"></span>
        </div>
      </article>

    </section>
  </main>

  <script>
    (function () {
      'use strict';

      /* =====================================================================
         Constants & State
         ===================================================================== */
      const LN4 = Math.log(4);
      const MIN_N = 2;
      const MAX_N = 1e9;
      const MIN_K = 1;
      const MAX_K = 30;
      const MIN_LOG_P = -6; // 10^-6 = 0.0001%
      const MAX_LOG_P = 0;  // 10^0  = 100%

      const state = {
        N: 1206,
        K: 10,
        P: 0.5,
        frozen: 'K',     // Always one of: 'N' | 'K' | 'P'
        pLogMode: false  // false = Linear (0–100%), true = Log (10^-6–1)
      };

      /* =====================================================================
         DOM References
         ===================================================================== */
      const els = {
        cards: {
          N: document.getElementById('cardN'),
          K: document.getElementById('cardK'),
          P: document.getElementById('cardP')
        },
        freezes: {
          N: document.getElementById('freezeN'),
          K: document.getElementById('freezeK'),
          P: document.getElementById('freezeP')
        },
        inputs: {
          N: document.getElementById('inputN'),
          K: document.getElementById('inputK'),
          P: document.getElementById('inputP')
        },
        sliders: {
          N: document.getElementById('sliderN'),
          K: document.getElementById('sliderK'),
          P: document.getElementById('sliderP')
        },
        badges: {
          N: document.getElementById('badgeN'),
          K: document.getElementById('badgeK'),
          P: document.getElementById('badgeP')
        },
        metaSpace: document.getElementById('metaSpace'),
        metaExactP: document.getElementById('metaExactP'),
        btnPLinear: document.getElementById('btnPLinear'),
        btnPLog: document.getElementById('btnPLog'),
        ticksP: document.getElementById('ticksP')
      };

      /* =====================================================================
         Numerically Stable Birthday Problem Solvers (Alphabet = 4, D = 4^K)
         ===================================================================== */

      /**
       * Solve for P given N and K:
       * P = -expm1(-(N * (N - 1)) / (2 * 4^K))
       */
      function solveP(N, K) {
        if (!Number.isFinite(N) || N <= 1) return 0;
        if (!Number.isFinite(K)) return K > 0 ? 0 : 1;
        const D = Math.pow(4, K);
        if (N > D) return 1;
        const lambda = (N * (N - 1)) / (2 * D);
        if (!Number.isFinite(lambda) || lambda >= 700) return 1;
        if (lambda <= 0) return 0;
        const p = -Math.expm1(-lambda);
        return Math.min(1, Math.max(0, p));
      }

      /**
       * Solve for N given K and P:
       * N = (1 + sqrt(1 - 8 * 4^K * log1p(-P))) / 2
       */
      function solveN(K, P) {
        const D = Math.pow(4, K);
        if (!Number.isFinite(P) || P <= 0) return MIN_N;
        if (P >= 1) return D;
        const safeP = Math.min(P, 1 - 1e-15);
        const radicand = 1 - 8 * D * Math.log1p(-safeP);
        if (!Number.isFinite(radicand) || radicand < 1) return MIN_N;
        const n = (1 + Math.sqrt(radicand)) / 2;
        return Math.max(MIN_N, n);
      }

      /**
       * Solve for K given N and P:
       * K = log((N * (N - 1)) / (-2 * log1p(-P))) / log(4)
       */
      function solveK(N, P) {
        if (!Number.isFinite(N) || N <= 1) return MAX_K;
        if (!Number.isFinite(P) || P <= 0) return MAX_K;
        if (P >= 1) return Math.max(0.1, Math.log(N) / LN4);
        const safeP = Math.max(1e-15, Math.min(P, 1 - 1e-15));
        const denom = -2 * Math.log1p(-safeP);
        if (denom <= 0 || !Number.isFinite(denom)) return MAX_K;
        // Log-space subtraction avoids N*(N-1) overflow for large N
        const k = (Math.log(N) + Math.log(N - 1) - Math.log(denom)) / LN4;
        return Number.isFinite(k) ? Math.max(0.1, k) : MAX_K;
      }

      /* =====================================================================
         Formatting & Parsing Helpers
         ===================================================================== */
      function toSuperscript(num) {
        const map = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
        return String(num).split('').map(c => map[c] || c).join('');
      }

      function formatSci(val, sig = 2) {
        if (!Number.isFinite(val)) return '∞';
        if (val === 0) return '0';
        const exp = Math.floor(Math.log10(Math.abs(val)));
        const mantissa = val / Math.pow(10, exp);
        return `${mantissa.toFixed(sig)}×10${toSuperscript(exp)}`;
      }

      function formatN(val) {
        if (!Number.isFinite(val)) return '∞';
        if (val >= 1e12) return formatSci(val, 2);
        return Math.round(Math.max(1, val)).toLocaleString('en-US');
      }

      function formatSpace(D) {
        if (!Number.isFinite(D)) return '∞';
        if (D < 1e7) return Math.round(D).toLocaleString('en-US');
        return formatSci(D, 2);
      }

      function formatPercent(P) {
        const pct = Math.min(100, Math.max(0, P * 100));
        if (pct === 0) return '0';
        if (pct >= 99.99995) return '100';
        if (pct >= 1) return pct.toFixed(2);
        if (pct >= 0.01) return pct.toFixed(4);
        if (pct >= 1e-4) return pct.toFixed(6);
        return pct.toExponential(2);
      }

      function formatExactP(P) {
        if (P <= 0) return '0';
        if (P >= 1) return '1.0000';
        if (P >= 0.001) return P.toFixed(4);
        return P.toExponential(2);
      }

      function parseNum(str) {
        const cleaned = String(str).replace(/,/g, '').replace(/%/g, '').trim();
        if (!cleaned) return NaN;
        return Number(cleaned);
      }

      /* =====================================================================
         Freeze State Styling & Enforcement (Always Exactly 1 Frozen)
         ===================================================================== */
      function updateFreezeUI() {
        ['N', 'K', 'P'].forEach(param => {
          const isFrozen = state.frozen === param;
          const card = els.cards[param];
          const checkbox = els.freezes[param];
          const pill = card.querySelector('.freeze-pill');
          const label = card.querySelector('.freeze-label');
          const divider = card.querySelector('.border-t');

          checkbox.checked = isFrozen;
          els.inputs[param].disabled = isFrozen;
          els.sliders[param].disabled = isFrozen;
          label.textContent = isFrozen ? 'Frozen' : 'Freeze';

          // Card border & background
          card.classList.toggle('bg-blue-50/70', isFrozen);
          card.classList.toggle('border-blue-400', isFrozen);
          card.classList.toggle('ring-2', isFrozen);
          card.classList.toggle('ring-blue-100', isFrozen);
          card.classList.toggle('bg-white', !isFrozen);
          card.classList.toggle('border-slate-200', !isFrozen);

          // Pill badge styling
          pill.classList.toggle('bg-blue-600', isFrozen);
          pill.classList.toggle('border-blue-600', isFrozen);
          pill.classList.toggle('text-white', isFrozen);
          pill.classList.toggle('bg-slate-100', !isFrozen);
          pill.classList.toggle('border-slate-200', !isFrozen);
          pill.classList.toggle('text-slate-600', !isFrozen);
          pill.classList.toggle('hover:bg-slate-200', !isFrozen);

          if (divider) {
            divider.classList.toggle('border-blue-200/60', isFrozen);
            divider.classList.toggle('border-slate-100', !isFrozen);
          }
        });
      }

      /* =====================================================================
         Synchronized Update & Rendering
         ===================================================================== */
      function setBadge(param, text) {
        const badge = els.badges[param];
        if (text) {
          badge.textContent = text;
          badge.classList.remove('hidden');
        } else {
          badge.textContent = '';
          badge.classList.add('hidden');
        }
      }

      function onParamChange(changedParam, newVal) {
        if (!Number.isFinite(newVal) || changedParam === state.frozen) return;
        state[changedParam] = newVal;

        const held = state.frozen;
        if (changedParam === 'N') {
          if (held === 'K') state.P = solveP(state.N, state.K);
          else state.K = solveK(state.N, state.P);
        } else if (changedParam === 'K') {
          if (held === 'N') state.P = solveP(state.N, state.K);
          else state.N = solveN(state.K, state.P);
        } else if (changedParam === 'P') {
          if (held === 'K') state.N = solveN(state.K, state.P);
          else state.K = solveK(state.N, state.P);
        }

        render(changedParam);
      }

      function render(activeInput = null) {
        // 1. N
        const clampedN = Math.min(MAX_N, Math.max(MIN_N, Number.isFinite(state.N) ? state.N : MAX_N));
        els.sliders.N.value = Math.log10(clampedN);
        if (activeInput !== 'N' || document.activeElement !== els.inputs.N) {
          els.inputs.N.value = formatN(state.N);
        }
        if (state.N > MAX_N) setBadge('N', '> 10⁹');
        else if (state.N < MIN_N) setBadge('N', '< 2');
        else setBadge('N', '');

        // 2. K
        const clampedK = Math.min(MAX_K, Math.max(MIN_K, Number.isFinite(state.K) ? state.K : MAX_K));
        els.sliders.K.value = clampedK;
        if (activeInput !== 'K' || document.activeElement !== els.inputs.K) {
          els.inputs.K.value = Number.isFinite(state.K) ? state.K.toFixed(1) : '30.0';
        }
        els.metaSpace.textContent = formatSpace(Math.pow(4, Math.max(0, state.K)));
        if (state.K > MAX_K) setBadge('K', '> 30');
        else if (state.K < MIN_K) setBadge('K', '< 1');
        else setBadge('K', '');

        // 3. P
        if (state.pLogMode) {
          const safeP = Math.max(1e-6, Math.min(1, state.P));
          els.sliders.P.value = Math.log10(safeP);
          setBadge('P', state.P < 1e-6 ? '< 10⁻⁶' : '');
        } else {
          els.sliders.P.value = Math.min(100, Math.max(0, state.P * 100));
          setBadge('P', '');
        }
        if (activeInput !== 'P' || document.activeElement !== els.inputs.P) {
          els.inputs.P.value = formatPercent(state.P);
        }
        els.metaExactP.textContent = formatExactP(state.P);
      }

      function setPLogMode(isLog) {
        state.pLogMode = isLog;

        // Toggle pill button styles
        const activeClasses = ['bg-white', 'text-indigo-600', 'shadow-sm'];
        const inactiveClasses = ['text-slate-500', 'hover:text-slate-700'];

        if (isLog) {
          els.btnPLog.classList.add(...activeClasses);
          els.btnPLog.classList.remove(...inactiveClasses);
          els.btnPLinear.classList.remove(...activeClasses);
          els.btnPLinear.classList.add(...inactiveClasses);

          els.sliders.P.min = String(MIN_LOG_P);
          els.sliders.P.max = String(MAX_LOG_P);
          els.sliders.P.step = '0.005';
          els.ticksP.innerHTML = '<span>10<sup>-6</sup></span><span>10<sup>-4</sup></span><span>10<sup>-2</sup></span><span>10%</span><span>100%</span>';
        } else {
          els.btnPLinear.classList.add(...activeClasses);
          els.btnPLinear.classList.remove(...inactiveClasses);
          els.btnPLog.classList.remove(...activeClasses);
          els.btnPLog.classList.add(...inactiveClasses);

          els.sliders.P.min = '0';
          els.sliders.P.max = '100';
          els.sliders.P.step = '0.01';
          els.ticksP.innerHTML = '<span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>';
        }
        render();
      }

      /* =====================================================================
         Event Listeners
         ===================================================================== */

      // Mutually exclusive Freeze checkboxes (strictly 1 always frozen)
      ['N', 'K', 'P'].forEach(param => {
        els.freezes[param].addEventListener('change', (e) => {
          if (e.target.checked) {
            state.frozen = param;
          } else {
            // Keep it checked so exactly one parameter is always frozen
            e.target.checked = true;
          }
          updateFreezeUI();
        });
      });

      // Sliders
      els.sliders.N.addEventListener('input', (e) => {
        onParamChange('N', Math.pow(10, parseFloat(e.target.value)));
      });

      els.sliders.K.addEventListener('input', (e) => {
        onParamChange('K', parseFloat(e.target.value));
      });

      els.sliders.P.addEventListener('input', (e) => {
        const raw = parseFloat(e.target.value);
        const pVal = state.pLogMode ? Math.pow(10, raw) : raw / 100;
        onParamChange('P', Math.min(1, Math.max(0, pVal)));
      });

      // Editable Numeric Inputs
      els.inputs.N.addEventListener('input', (e) => {
        const val = parseNum(e.target.value);
        if (Number.isFinite(val) && val >= 2) {
          onParamChange('N', val);
        }
      });
      els.inputs.N.addEventListener('blur', () => render());

      els.inputs.K.addEventListener('input', (e) => {
        const val = parseNum(e.target.value);
        if (Number.isFinite(val) && val >= 0.1 && val <= 100) {
          onParamChange('K', val);
        }
      });
      els.inputs.K.addEventListener('blur', () => render());

      els.inputs.P.addEventListener('input', (e) => {
        const val = parseNum(e.target.value);
        if (Number.isFinite(val) && val >= 0 && val <= 100) {
          onParamChange('P', val / 100);
        }
      });
      els.inputs.P.addEventListener('blur', () => render());

      // Linear / Log scale toggle for P
      els.btnPLinear.addEventListener('click', () => setPLogMode(false));
      els.btnPLog.addEventListener('click', () => setPLogMode(true));

      /* =====================================================================
         Initialize (Default: K = 10 frozen, P = 50%, N ≈ 1,206)
         ===================================================================== */
      window.addEventListener('DOMContentLoaded', () => {
        state.K = 10;
        state.P = 0.5;
        state.N = solveN(state.K, state.P);
        state.frozen = 'K';

        updateFreezeUI();
        render();
      });
    })();
  </script>
</body>
</html>
